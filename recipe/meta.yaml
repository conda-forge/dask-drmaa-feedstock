{% set name = "dask-drmaa" %}
{% set version = "0.2.1" %}
{% set sha256 = "8b02524c38138358da2076c3405a340b493a6f07f2a2865e6805edce073ca6d2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv
  entry_points:
    - dask-drmaa = dask_drmaa.cli.dask_drmaa:go

requirements:
  host:
    - python {{ python_min }}
    - pip

  run:
    - python >={{ python_min }}
    - dask-core
    - distributed >=1.21.3
    - drmaa
    - click

about:
  home: https://github.com/dask/dask-drmaa
  license: BSD 3-Clause
  license_file: LICENSE.txt
  summary: Dask on DRMAA

  dev_url: https://github.com/dask/dask-drmaa

extra:
  recipe-maintainers:
    - jakirkham
    - mrocklin
